    // GridCrosshair Component
    function GridCrosshair({ style = {}, className = '' }) {
      return (
        <div className={`grid-crosshair ${className}`} style={style} aria-hidden="true">
          <span className="cross-v" />
          <span className="cross-h" />
        </div>
      );
    }

    // SectionGrid Component
    function SectionGrid({ theme = 'light', showTopLine = true, showBottomLine = false, crosshairPositions = [0, 4] }) {
      const colPercentages = ['0%', '25%', '50%', '75%', '100%'];
      return (
        <div className={`section-grid-backdrop ${theme === 'dark' ? 'grid-dark' : 'grid-light'}`} aria-hidden="true">
          <div className="section-grid-container">
            <div className="section-grid-line col-0" style={{ left: '0%' }} />
            <div className="section-grid-line col-1" style={{ left: '25%' }} />
            <div className="section-grid-line col-2" style={{ left: '50%' }} />
            <div className="section-grid-line col-3" style={{ left: '75%' }} />
            <div className="section-grid-line col-4" style={{ left: '100%' }} />
            {showTopLine && (
              <div className="section-grid-h-line top">
                {crosshairPositions.map(colIdx => (
                  <GridCrosshair key={`top-cross-${colIdx}`} style={{ left: colPercentages[colIdx], top: '0px' }} />
                ))}
              </div>
            )}
            {showBottomLine && (
              <div className="section-grid-h-line bottom">
                {crosshairPositions.map(colIdx => (
                  <GridCrosshair key={`bot-cross-${colIdx}`} style={{ left: colPercentages[colIdx], top: '0px' }} />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // 1. RollingText Component
    function RollingText({ text, className = '' }) {
      const chars = Array.from(text);
      return (
        <span className={`roll-text-hover ${className}`} aria-label={text}>
          {chars.map((char, idx) => {
            const displayChar = char === ' ' ? '\u00A0' : char;
            return (
              <span key={idx} className="char-slot" style={{ transitionDelay: `${idx * 0.025}s` }}>
                <span className="char-top">{displayChar}</span>
                <span className="char-bottom">{displayChar}</span>
              </span>
            );
          })}
        </span>
      );
    }

    // 2. RevealText Component (Scroll-illuminated typography)
    function RevealText({ text, className = '' }) {
      const containerRef = useRef(null);
      const [progress, setProgress] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          if (!containerRef.current) return;
          const rect = containerRef.current.getBoundingClientRect();
          const windowHeight = window.innerHeight;
          const start = windowHeight * 0.85;
          const end = windowHeight * 0.25;
          const total = start - end;
          const current = start - rect.top;
          let p = current / total;
          p = Math.max(0, Math.min(1, p));
          setProgress(p);
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const words = text.split(/\s+/);
      const revealedCount = Math.floor(progress * words.length);

      return (
        <div ref={containerRef} className={className}>
          {words.map((word, idx) => (
            <span key={idx} className={`reveal-word ${idx <= revealedCount ? 'is-revealed' : ''}`}>
              {word}{' '}
            </span>
          ))}
        </div>
      );
    }

    // Root App Component
    function App() {
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [currentPath, setCurrentPath] = useState(() => {
        if (typeof window !== 'undefined') {
          const p = window.location.pathname.toLowerCase();
          const h = window.location.hash.toLowerCase();
          if (p.includes('contact') || h.includes('contact-page')) {
            return '/contact';
          }
        }
        return '/';
      });

      const navigate = (path) => {
        if (typeof window !== 'undefined') {
          window.history.pushState({}, '', path);
          setCurrentPath(path);
          window.scrollTo({ top: 0, behavior: 'instant' });
        }
      };

      useEffect(() => {
        const handlePop = () => {
          const p = window.location.pathname.toLowerCase();
          const h = window.location.hash.toLowerCase();
          if (p.includes('contact') || h.includes('contact-page')) {
            setCurrentPath('/contact');
          } else {
            setCurrentPath('/');
          }
          window.scrollTo({ top: 0, behavior: 'instant' });
        };
        window.addEventListener('popstate', handlePop);
        window.addEventListener('hashchange', handlePop);
        return () => {
          window.removeEventListener('popstate', handlePop);
          window.removeEventListener('hashchange', handlePop);
        };
      }, []);

      return (
        <div className="app-root">
          <Header isDrawerOpen={isDrawerOpen} setIsDrawerOpen={setIsDrawerOpen} navigate={navigate} currentPath={currentPath} />
          <NavDrawer isOpen={isDrawerOpen} onClose={() => setIsDrawerOpen(false)} navigate={navigate} currentPath={currentPath} />

          <main>
            {currentPath === '/contact' ? (
              <ContactPage navigate={navigate} />
            ) : (
              <>
                <Hero />
                <Approach />
                <WhyUs />
                <HowWeDoIt />
                <Results />
                <MoreProjects />
                <Team />
                <Timeline />
                <Insights />
                <Faq />
                <Contact navigate={navigate} />
              </>
            )}
          </main>

          <Footer />
        </div>
      );
    }

    // Mount to Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
